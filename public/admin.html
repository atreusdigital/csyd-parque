<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSyD Parque — Sistema de Gestión</title>
<style>
  :root{
    /* Paleta muestreada pixel-a-pixel del escudo CSyD Parque */
    --verde:#005020;        /* verde del escudo */
    --verde-osc:#003818;
    --verde-claro:#e6efe8;
    --rojo:#e0282e;         /* rojo del escudo y "GP" */
    --rojo-osc:#b01b22;
    --blanco:#ffffff;
    --gris:#f4f6f5;
    --texto:#1b1f1c;
    --borde:#d9e1db;
    --amarillo:#f4b400;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--gris);color:var(--texto);font-size:14px}
  header{background:linear-gradient(135deg,var(--verde),var(--verde-osc));color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.15);border-bottom:4px solid var(--rojo)}
  .logo{width:56px;height:62px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
  .logo img{width:100%;height:100%;object-fit:contain}
  header h1{margin:0;font-size:18px;letter-spacing:.3px}
  header .sub{opacity:.85;font-size:12px}
  .shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 76px)}
  nav.side{background:#fff;border-right:1px solid var(--borde);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
  nav.side button{background:transparent;border:0;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:#2a2a2a;display:flex;align-items:center;gap:10px}
  nav.side button:hover{background:var(--verde-claro)}
  nav.side button.active{background:var(--verde);color:#fff;font-weight:600}
  nav.side .dot{width:8px;height:8px;border-radius:50%;background:var(--rojo);display:inline-block}
  nav.side .nav-group-head{font-weight:600}
  nav.side .nav-group-head .chev{margin-left:auto;font-size:11px;color:#999;transition:transform .15s}
  nav.side .nav-group.open .nav-group-head .chev{transform:rotate(90deg)}
  nav.side .nav-group-items{display:none;flex-direction:column;gap:3px;padding-left:18px;margin:2px 0}
  nav.side .nav-group.open .nav-group-items{display:flex}
  nav.side .nav-group-items button{font-size:13px;padding:8px 10px}
  main{padding:22px 26px;overflow:auto}
  h2.page{margin:0 0 14px;font-size:22px;color:var(--verde-osc);border-bottom:3px solid var(--rojo);padding-bottom:6px;display:inline-block}
  .grid{display:grid;gap:14px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  .card{background:#fff;border:1px solid var(--borde);border-radius:10px;padding:14px 16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .kpi .label{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.5px}
  .kpi .val{font-size:26px;font-weight:800;color:var(--verde-osc);margin-top:6px}
  .kpi .delta{font-size:12px;margin-top:4px}
  .delta.up{color:var(--verde)} .delta.down{color:var(--rojo)}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--borde)}
  th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--borde);font-size:13px}
  th{background:var(--verde-claro);color:var(--verde-osc);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.4px}
  tr:last-child td{border-bottom:0}
  tr:hover td{background:#fafdfb}
  .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .b-ok{background:#dff3e3;color:var(--verde-osc)}
  .b-warn{background:#fff3cd;color:#8a6d00}
  .b-err{background:#fadcdf;color:var(--rojo-osc)}
  .b-info{background:#e0ecff;color:#1b4a9a}
  button.btn{background:var(--verde);color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
  button.btn:hover{background:var(--verde-osc)}
  button.btn.alt{background:var(--rojo)}
  button.btn.alt:hover{background:var(--rojo-osc)}
  button.btn.ghost{background:transparent;color:var(--verde-osc);border:1px solid var(--verde)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
  input,select{padding:8px 10px;border:1px solid var(--borde);border-radius:8px;font-size:13px;background:#fff}
  .two-col{grid-template-columns:1.4fr 1fr}
  .three-col{grid-template-columns:repeat(3,1fr)}
  @media(max-width:1000px){.two-col,.three-col{grid-template-columns:1fr}}
  .mini{font-size:12px;color:#666}
  .pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--borde);padding:4px 10px;border-radius:999px;font-size:12px}
  .bar{height:8px;background:#eee;border-radius:999px;overflow:hidden}
  .bar>span{display:block;height:100%;background:var(--verde)}
  .turnstile{background:#0e0e12;color:#d8f5dc;border-radius:12px;padding:18px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:170px}
  .turnstile .ok{color:#5dff8b}
  .turnstile .no{color:#ff5d6c}
  .chat{background:#fff;border:1px solid var(--borde);border-radius:10px;height:360px;display:flex;flex-direction:column}
  .chat .msgs{flex:1;padding:12px;overflow:auto;display:flex;flex-direction:column;gap:8px}
  .bubble{padding:8px 12px;border-radius:14px;max-width:78%;line-height:1.35}
  .bubble.b{background:var(--verde-claro);align-self:flex-start;border:1px solid #cfe4d5}
  .bubble.u{background:var(--verde);color:#fff;align-self:flex-end}
  .chat .inp{border-top:1px solid var(--borde);display:flex;gap:6px;padding:8px}
  .chat .inp input{flex:1}
  .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .slot{background:#fff;border:1px solid var(--borde);padding:6px;border-radius:6px;font-size:11px;min-height:44px;cursor:pointer;text-align:center}
  .slot.ocupado{background:var(--rojo);color:#fff;border-color:var(--rojo-osc)}
  .slot.libre{background:var(--verde-claro)}
  .slot.tentativo{background:#fff3cd}
  .legend{display:flex;gap:10px;font-size:12px;margin:8px 0}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend .sq{width:12px;height:12px;border-radius:3px;display:inline-block}
  .alert-card{border-left:4px solid var(--rojo);background:#fff}
  .alert-card.warn{border-left-color:var(--amarillo)}
  .alert-card.ok{border-left-color:var(--verde)}
  footer{text-align:center;padding:14px;color:#777;font-size:12px;border-top:1px solid var(--borde);background:#fff}
  .hidden{display:none}

  /* ============ POLISH: accesibilidad, transitions, loading, responsive ============ */
  *:focus-visible{outline:3px solid var(--verde);outline-offset:2px;border-radius:4px}
  nav.side button:focus-visible{outline-offset:-3px}
  button,a,.slot,select,input{transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease,transform .08s ease}
  button.btn{will-change:transform}
  button.btn:active{transform:translateY(1px)}
  button:disabled{opacity:.55;cursor:not-allowed;transform:none}
  input:focus,select:focus{border-color:var(--verde);outline:none;box-shadow:0 0 0 3px rgba(0,80,32,.18)}
  input:disabled{background:#f0f0f0;cursor:wait}
  tbody tr{transition:background-color .12s ease}
  .btn.ghost:hover{background:var(--verde-claro)}

  /* Slots de canchas */
  .slot:hover{filter:brightness(.94)}
  .slot:active{transform:scale(.97)}
  .slot.libre:hover{background:#d7e7dc}

  /* Skeleton loading */
  .sk{display:inline-block;background:linear-gradient(90deg,#eef1ee 0%,#f7f9f7 50%,#eef1ee 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px;color:transparent;min-height:14px;min-width:80px}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .loading-row td{color:#999;padding:18px;text-align:center}

  /* Fade-in de burbujas de chat */
  .bubble{animation:fadeIn .16s ease-out}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Error banner (role=alert) */
  [role="alert"]{border:1px solid var(--rojo-osc);background:#fbe9eb;color:var(--rojo-osc);padding:10px 12px;border-radius:8px;margin:8px 0}

  /* Empty states — estilo sutil consistente */
  .empty{padding:24px;text-align:center;color:#888;font-size:13px}
  .empty b{display:block;color:#555;font-size:15px;margin-bottom:4px}

  /* Screen-reader only */
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* Reloj con tabular-nums para no saltar */
  #clock{font-variant-numeric:tabular-nums}

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(12,20,15,.55);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .18s ease;padding:20px}
  .modal-backdrop.show{opacity:1;pointer-events:auto}
  .modal-dialog{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:calc(100vh - 40px);overflow:auto;transform:translateY(10px) scale(.98);transition:transform .2s ease;box-shadow:0 24px 60px rgba(0,0,0,.35);border-top:4px solid var(--verde)}
  .modal-dialog.wide{max-width:720px}
  .modal-backdrop.show .modal-dialog{transform:none}
  .modal-header{padding:14px 18px;border-bottom:1px solid var(--borde);display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--verde-claro)}
  .modal-header h3{margin:0;color:var(--verde-osc);font-size:17px}
  .modal-close{background:transparent;border:0;font-size:24px;cursor:pointer;color:var(--verde-osc);padding:0 8px;border-radius:6px;line-height:1;font-weight:300}
  .modal-close:hover{background:#fff}
  .modal-body{padding:18px 20px}
  .modal-footer{padding:12px 20px;border-top:1px solid var(--borde);display:flex;justify-content:flex-end;gap:8px;background:#fafbfa;border-radius:0 0 10px 10px}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .form-grid label{display:flex;flex-direction:column;font-size:11px;color:#666;gap:4px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  .form-grid label.full{grid-column:1/-1}
  .form-grid input,.form-grid select,.form-grid textarea{font-size:14px;padding:9px 11px;border:1px solid var(--borde);border-radius:8px;font-family:inherit;color:var(--texto);text-transform:none;font-weight:400;letter-spacing:normal}
  .form-grid fieldset{border:1px solid var(--borde);border-radius:8px;padding:8px 10px;min-width:0}
  .form-grid fieldset legend{padding:0 4px;font-size:11px;color:#666;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .form-grid fieldset label{flex-direction:row;align-items:center;gap:5px;margin:2px 8px 2px 0;font-weight:500;text-transform:none;letter-spacing:normal;color:var(--texto);font-size:13px;display:inline-flex}
  .info-grid{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;align-items:baseline}
  .info-grid dt{color:#888;font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .info-grid dd{margin:0;font-weight:600;color:var(--texto);word-break:break-word}
  .slot.pagado{background:var(--verde);color:#fff;border-color:var(--verde-osc)}
  .slot.pendiente{background:var(--rojo);color:#fff;border-color:var(--rojo-osc)}
  @media(max-width:560px){ .form-grid{grid-template-columns:1fr} .info-grid{grid-template-columns:1fr;gap:2px} .info-grid dt{margin-top:8px} }

  /* Mobile (≤720px) */
  @media(max-width:720px){
    .shell{grid-template-columns:1fr}
    nav.side{flex-direction:row;overflow-x:auto;padding:8px;gap:6px;border-right:0;border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:10}
    nav.side button{white-space:nowrap;flex:0 0 auto;padding:8px 12px}
    main{padding:16px}
    header{padding:12px 14px;flex-wrap:wrap}
    header h1{font-size:16px}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .kpi .val{font-size:20px}
    table{font-size:12px}
    th,td{padding:7px 8px}
    .chat{height:300px}
  }
</style>
</head>

<script>
/* =========================================================
   CSyD PARQUE — Frontend conectado al backend real (Supabase + Claude)
   ========================================================= */
const API = '/api';
const fmtM = n => '$' + Math.round(Number(n) || 0).toLocaleString('es-AR');
const fmtF = d => d ? new Date(d).toLocaleDateString('es-AR') : '-';
const carnet = id => 'CP-' + String(id).padStart(4, '0');

/* Estado (cache por pantalla + historial del chat) */
const state = { historial: [] };

/* Helper fetch con Bearer token */
function getAdminToken() { return localStorage.getItem('parque_admin_token') || ''; }
function setAdminToken(t, exp) {
  if (t) { localStorage.setItem('parque_admin_token', t); localStorage.setItem('parque_admin_exp', exp || 0); }
  else { ['parque_admin_token','parque_admin_exp','parque_admin_rol','parque_admin_nombre'].forEach(k => localStorage.removeItem(k)); }
}
function isAdminLogged() {
  const t = getAdminToken();
  const exp = Number(localStorage.getItem('parque_admin_exp') || 0);
  return !!t && exp > Date.now();
}

/* ═══ Roles y permisos por sección ═══ */
const PERMS = {
  admin:     { ver: ['dashboard','socios','cuotas','ingresos','egresos','finanzas','alquileres','fijos','accesos','comunicacion','ia','usuarios','config'],
               editar: ['socios','cuotas','ingresos','egresos','finanzas','alquileres','fijos','accesos','comunicacion','ia','usuarios','config'] },
  tesoreria: { ver: ['dashboard','socios','cuotas','ingresos','egresos','finanzas','comunicacion','ia'],
               editar: ['cuotas','ingresos','egresos','finanzas','comunicacion','ia'] },
  recepcion: { ver: ['dashboard','socios','cuotas','alquileres','fijos','accesos','comunicacion'],
               editar: ['socios','alquileres','fijos','accesos','comunicacion'] },
  profe:     { ver: ['dashboard','socios','accesos'], editar: [] },
};
function rolActual() { return localStorage.getItem('parque_admin_rol') || 'admin'; }
function rolLabel(r) { return ({admin:'Admin', tesoreria:'Tesorería', recepcion:'Recepción', profe:'Profe'})[r] || r; }
function puedeVer(p) { return (PERMS[rolActual()]?.ver || []).includes(p); }
function puedeEditar(p) { return (PERMS[rolActual()]?.editar || []).includes(p); }
function aplicarPermisos() {
  if (typeof renderMenu === 'function') renderMenu();
  const pill = document.getElementById('userPill');
  if (pill) pill.textContent = '👤 ' + (localStorage.getItem('parque_admin_nombre') || 'Administrador') + ' · ' + rolLabel(rolActual());
}
async function api(path, opts = {}) {
  try {
    const headers = { 'Content-Type': 'application/json' };
    const tok = getAdminToken();
    if (tok) headers['Authorization'] = 'Bearer ' + tok;
    const r = await fetch(API + path, {
      method: opts.method || 'GET',
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    });
    if (r.status === 401) {
      setAdminToken(null);
      mostrarLogin('Tu sesión expiró. Volvé a ingresar.');
      return null;
    }
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`);
    return data;
  } catch (e) {
    console.error('[api]', path, e);
    return null;
  }
}

/* ═══ Login gate ═══ */
function mostrarLogin(msg = '') {
  const existing = document.getElementById('loginOverlay');
  if (existing) existing.remove();
  const ov = document.createElement('div');
  ov.id = 'loginOverlay';
  ov.style.cssText = 'position:fixed;inset:0;background:#0f1916;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;font-family:Manrope,sans-serif';
  ov.innerHTML = `
    <div style="background:#1a2821;border:1px solid #2a3a30;border-radius:12px;padding:32px 28px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)">
      <div style="text-align:center;margin-bottom:22px">
        <img src="/logo.png" alt="" style="height:56px;margin-bottom:10px">
        <div style="color:#fff;font-size:20px;font-weight:700">CSyD Parque</div>
        <div style="color:#8aa59a;font-size:12px;letter-spacing:1px;text-transform:uppercase;margin-top:2px">Panel Administración</div>
      </div>
      <form id="loginForm" autocomplete="off">
        <label style="color:#8aa59a;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700">Usuario</label>
        <input type="text" id="loginUser" autofocus required autocapitalize="off" autocomplete="username" style="width:100%;margin:6px 0 12px;padding:12px 14px;background:#0f1916;border:1px solid #2a3a30;border-radius:6px;color:#fff;font-size:15px;font-family:inherit">
        <label style="color:#8aa59a;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700">Contraseña</label>
        <input type="password" id="loginPass" required autocomplete="current-password" style="width:100%;margin:6px 0 14px;padding:12px 14px;background:#0f1916;border:1px solid #2a3a30;border-radius:6px;color:#fff;font-size:15px;font-family:inherit">
        <div id="loginMsg" style="color:#e0282e;font-size:12.5px;min-height:18px;margin-bottom:10px;font-weight:600">${msg}</div>
        <button type="submit" style="width:100%;padding:13px;background:#005020;color:#fff;border:0;border-radius:6px;font-weight:700;letter-spacing:.5px;cursor:pointer;font-family:inherit;font-size:14px">Ingresar</button>
      </form>
    </div>`;
  document.body.appendChild(ov);
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const usuario = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    const msgEl = document.getElementById('loginMsg');
    msgEl.textContent = 'Verificando…';
    msgEl.style.color = '#8aa59a';
    try {
      const r = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, password: pass }),
      });
      const data = await r.json();
      if (!r.ok) {
        msgEl.textContent = data.error || 'Error';
        msgEl.style.color = '#e0282e';
        return;
      }
      setAdminToken(data.token, data.expiresAt);
      localStorage.setItem('parque_admin_rol', data.rol || 'admin');
      localStorage.setItem('parque_admin_nombre', data.nombre || 'Administrador');
      ov.remove();
      if (typeof window.adminInit === 'function') window.adminInit();
    } catch (err) {
      msgEl.textContent = 'Error de conexión';
      msgEl.style.color = '#e0282e';
    }
  });
}
function logoutAdmin() {
  setAdminToken(null);
  mostrarLogin('Sesión cerrada');
}
window.logoutAdmin = logoutAdmin;

/* Semana / fechas */
function inicioSemana(d = new Date()) {
  const x = new Date(d);
  const dow = (x.getDay() + 6) % 7; // lunes=0
  x.setDate(x.getDate() - dow);
  x.setHours(0,0,0,0);
  return x;
}
function isoDate(d) { return d.toISOString().split('T')[0]; }
function fmtDiaSem(lunes, i) {
  const dias = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  const x = new Date(lunes); x.setDate(x.getDate() + i);
  return `${dias[i]} ${x.getDate()}`;
}

/* Safe HTML helpers */
function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderMD(s) { return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>'); }

/* =========================================================
   MODAL SYSTEM
   ========================================================= */
function modal({ title, html, actions = [], wide = false, onClose }) {
  document.querySelectorAll('.modal-backdrop').forEach(m => m.remove());
  const tid = 'mt-' + Math.random().toString(36).slice(2, 8);
  const el = document.createElement('div');
  el.className = 'modal-backdrop';
  el.innerHTML = `
    <div class="modal-dialog ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="${tid}">
      <div class="modal-header"><h3 id="${tid}">${esc(title)}</h3><button class="modal-close" aria-label="Cerrar" type="button">×</button></div>
      <div class="modal-body">${html}</div>
      ${actions.length ? `<div class="modal-footer">${actions.map((a,i) => `<button type="button" data-idx="${i}" class="btn ${a.variant || ''}">${esc(a.label)}</button>`).join('')}</div>` : ''}
    </div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));

  const onKey = e => { if (e.key === 'Escape') doClose(); };
  function doClose() {
    el.classList.remove('show');
    document.removeEventListener('keydown', onKey);
    setTimeout(() => { el.remove(); onClose?.(); }, 200);
  }
  el.querySelector('.modal-close').addEventListener('click', doClose);
  el.addEventListener('click', e => { if (e.target === el) doClose(); });
  actions.forEach((a, i) => {
    el.querySelector(`[data-idx="${i}"]`).addEventListener('click', async () => {
      const keep = await a.onClick?.(el);
      if (!keep) doClose();
    });
  });
  document.addEventListener('keydown', onKey);
  const firstInput = el.querySelector('input, select, textarea');
  if (firstInput) setTimeout(() => firstInput.focus(), 50);
  return { el, close: doClose };
}

function fieldHTML(f, initial) {
  const v = initial[f.name] ?? f.default ?? '';
  const cls = f.full ? 'full' : '';
  const req = f.required ? 'required' : '';
  if (f.type === 'select') {
    return `<label class="${cls}">${esc(f.label)}<select name="${f.name}" ${req}>${(f.options || []).map(o => {
      const val = typeof o === 'object' ? o.value : o;
      const lbl = typeof o === 'object' ? o.label : o;
      return `<option value="${esc(val)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(lbl)}</option>`;
    }).join('')}</select></label>`;
  }
  if (f.type === 'checkbox') {
    return `<label class="${cls}" style="flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:normal;color:var(--texto);font-size:13px;font-weight:500"><input type="checkbox" name="${f.name}" value="1" ${v ? 'checked' : ''}/> ${esc(f.label)}</label>`;
  }
  if (f.type === 'multi') {
    return `<fieldset class="${cls}"><legend>${esc(f.label)}</legend>${(f.options || []).map(o => `<label><input type="checkbox" name="${f.name}" value="${esc(o)}" ${Array.isArray(v) && v.includes(o) ? 'checked' : ''}/> ${esc(o)}</label>`).join('')}</fieldset>`;
  }
  return `<label class="${cls}">${esc(f.label)}<input name="${f.name}" type="${f.type || 'text'}" value="${esc(v)}" ${req} ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''} ${f.step ? `step="${f.step}"` : ''}/></label>`;
}

function formModal({ title, fields, submitLabel = 'Guardar', onSubmit, initial = {}, wide = false }) {
  const html = `<form id="modalForm" class="form-grid" onsubmit="event.preventDefault()">${fields.map(f => fieldHTML(f, initial)).join('')}</form>`;
  return modal({
    title, html, wide,
    actions: [
      { label: 'Cancelar', variant: 'ghost' },
      { label: submitLabel, onClick: async (el) => {
        const form = el.querySelector('#modalForm');
        const values = {};
        fields.forEach(f => {
          if (f.type === 'multi') {
            values[f.name] = [...form.querySelectorAll(`[name="${f.name}"]:checked`)].map(c => c.value);
          } else if (f.type === 'checkbox') {
            values[f.name] = form.querySelector(`[name="${f.name}"]`)?.checked || false;
          } else {
            const input = form.querySelector(`[name="${f.name}"]`);
            values[f.name] = input ? input.value : '';
          }
        });
        for (const f of fields) {
          if (f.required) {
            const v = values[f.name];
            const empty = Array.isArray(v) ? v.length === 0 : !v;
            if (empty) {
              const input = form.querySelector(`[name="${f.name}"]`);
              if (input) input.focus();
              return true;
            }
          }
        }
        const keep = await onSubmit(values, el);
        return !!keep;
      }},
    ],
  });
}

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${type==='err'?'var(--rojo)':'var(--verde)'};color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:200;font-size:14px;font-weight:600;animation:fadeIn .2s ease-out`;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 2400);
}

/* Display helpers */
function displayEstado(s) {
  if (s.activo === false) return { label: 'De Baja', cls: 'b-warn' };
  if (s.estado_cuota === 'Moroso' || s.estado_cuota === 'Suspendido') return { label: 'INHABILITADO', cls: 'b-err' };
  return { label: 'HABILITADO', cls: 'b-ok' };
}
function displayGenero(g) { return g === 'F' ? 'Femenino' : g === 'M' ? 'Masculino' : g === 'O' ? 'Otro' : '—'; }
function cuotaMensual(s) {
  const social = window._cuotaSocial ?? 1000;
  const precios = window._precios || {};
  const ds = Array.isArray(s.disciplinas) ? s.disciplinas : [];
  return social + ds.reduce((a, d) => a + (precios[d] || 0), 0);
}
async function cargarPrecios() {
  if (window._precios) return;
  const [discs, cfg] = await Promise.all([ api('/disciplinas'), api('/config') ]);
  window._precios = {}; (discs || []).forEach(d => { window._precios[d.nombre] = Number(d.precio) || 48000; });
  window._cuotaSocial = Number(cfg?.cuota_social ?? 1000);
}

function grupoDe(page) {
  for (const m of MENU) if (m.items && m.items.some(i => i.page === page)) return m.group;

function renderMenu() {
  nav.innerHTML = MENU.map(m => {

      return `<button class="nav-item" data-page="${m.page}"><span class="dot"></span> ${m.label}</button>`;
    }

    return `<div class="nav-group" data-group="${m.group}">
      <button class="nav-group-head"><span class="dot"></span> ${m.label}<span class="chev">▸</span></button>
      <div class="nav-group-items">${items.map(i => `<button class="nav-item" data-page="${i.page}">${i.label}</button>`).join('')}</div>

  }).join('');
}
nav.addEventListener('click', e => {
  const head = e.target.closest('.nav-group-head');
  if (head) { head.closest('.nav-group')?.classList.toggle('open'); return; }
  const b = e.target.closest('button[data-page]');
  if (b) render(b.dataset.page);
});

async function render(p) {
  if (!puedeVer(p)) {
    $('#main').innerHTML = '<div role="alert" style="margin-top:20px">No tenés permiso para acceder a esta sección. Contactá al administrador.</div>';
    return;
  }
  nav.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('active', x.dataset.page === p));
  const _g = grupoDe(p);
  if (_g) nav.querySelectorAll('.nav-group').forEach(gr => { if (gr.dataset.group === _g) gr.classList.add('open'); });
  $('#main').innerHTML = `
    <div style="display:grid;gap:14px">
      <div class="sk" style="height:28px;width:280px"></div>
      <div class="grid kpis">${'<div class="card kpi"><div class="sk" style="height:12px;width:110px"></div><div class="sk" style="height:28px;width:140px;margin-top:10px"></div></div>'.repeat(6)}</div>
      <div class="grid two-col">
        <div class="card"><div class="sk" style="height:18px;width:200px"></div><div class="sk" style="height:120px;width:100%;margin-top:10px"></div></div>
        <div class="card"><div class="sk" style="height:18px;width:180px"></div><div class="sk" style="height:120px;width:100%;margin-top:10px"></div></div>
      </div>
    </div>`;
  try {
    const html = pages[p] ? await pages[p]() : '<p>Página en construcción</p>';
    $('#main').innerHTML = html;
    afterRender(p);
  } catch (e) {
    console.error(e);
    $('#main').innerHTML = `<div role="alert">Error cargando la página: ${esc(e.message)}</div>`;
  }
}

window._semanaOffset = 0;
window.cambiarSemana = function(delta) {
  if (delta === 0) window._semanaOffset = 0;
  else window._semanaOffset += delta;
  renderAlquilerGrid();
};

async function renderAlquilerGrid() {
  const grid = document.getElementById('alquilerGrid');
  const statsEl = document.getElementById('alquilerStats');
  const semanaLabelEl = document.getElementById('semanaLabel');
  if (!grid) return;
  grid.innerHTML = '<div class="sk" style="height:180px;width:100%"></div>';
  const cancha = document.getElementById('canchaSel')?.value || '';
  const lunes = inicioSemana();
  lunes.setDate(lunes.getDate() + (window._semanaOffset || 0) * 7);
  if (semanaLabelEl) {
    const dom = new Date(lunes); dom.setDate(dom.getDate()+6);
    semanaLabelEl.textContent = `— ${lunes.toLocaleDateString('es-AR')} al ${dom.toLocaleDateString('es-AR')}`;
  }
  const fechas = [0,1,2,3,4,5,6].map(i => { const d = new Date(lunes); d.setDate(d.getDate()+i); return isoDate(d); });
  const dias = [0,1,2,3,4,5,6].map(i => fmtDiaSem(lunes, i));
  const dowFechas = [0,1,2,3,4,5,6].map(i => { const d = new Date(lunes); d.setDate(d.getDate()+i); return d.getDay(); });
  const horas = [21, 22];

  const [arrays, fijos] = await Promise.all([
    Promise.all(fechas.map(f => api('/alquileres?fecha=' + f + '&cancha=' + encodeURIComponent(cancha)))),
    api('/alquileres/fijos') || [],
  ]);
  const reservas = arrays.flatMap((arr, i) => (arr || [])
    .filter(a => !a.estado || a.estado === 'confirmada' || (a.estado === 'pending' && a.expires_at && new Date(a.expires_at) > new Date()))
    .map(a => ({...a, diaIdx: i})));
  const ocup = new Map();
  reservas.forEach(r => ocup.set(`${r.diaIdx}|${Number(r.hora)}`, r));

  const fijosList = (fijos || []).filter(f => f.cancha === cancha);
  const fijosMap = new Map();
  fijosList.forEach(f => fijosMap.set(`${f.dia_semana}|${f.hora}`, f));

  let html = `<div style="display:grid;grid-template-columns:70px repeat(7,1fr);gap:4px;align-items:center">
    <div></div>${dias.map(d => `<div class="mini" style="text-align:center"><b>${d}</b></div>`).join('')}`;
  horas.forEach(h => {
    html += `<div class="mini"><b>${h}:00</b></div>`;
    for (let i = 0; i < 7; i++) {
      const r = ocup.get(`${i}|${h}`);
      const f = !r && fijosMap.get(`${dowFechas[i]}|${h}`);
      if (r) {
        const st = r.pagado ? 'pagado' : 'pendiente';
        html += `<div class="slot ${st}" title="${esc(r.cliente || 'Reservado')}" onclick="clickSlot('${esc(cancha).replace(/'/g,"\\'")}','${fechas[i]}',${h},${r.id})">${st}</div>`;
      } else if (f) {
        html += `<div class="slot" style="background:#f0cccc;color:#8e2a2d;cursor:default;font-size:11.5px;font-weight:700;letter-spacing:.2px;text-align:center;padding:6px 4px;line-height:1.2" title="Turno fijo — ${esc(f.cliente || '')}">${esc(f.cliente || 'Fijo')}</div>`;
      } else {
        html += `<div class="slot libre" title="Libre" onclick="clickSlot('${esc(cancha).replace(/'/g,"\\'")}','${fechas[i]}',${h},null)">libre</div>`;
      }
    }
  });
  html += '</div>';
  grid.innerHTML = html;

  const totalSlots = 7 * horas.length;
  const ocupSlots = reservas.length;
  const fijosSemana = fijosList.length;
  const ocupPct = Math.round((ocupSlots + fijosSemana) / totalSlots * 100);
  const ingSem = reservas.reduce((a, r) => a + Number(r.monto || 0), 0);
  statsEl.innerHTML = `
    <div class="card kpi"><div class="label">Ocupación semanal</div><div class="val">${ocupPct}%</div><div class="bar"><span style="width:${ocupPct}%"></span></div></div>
    <div class="card kpi"><div class="label">Ingresos de la semana</div><div class="val" style="color:var(--verde)">${fmtM(ingSem)}</div></div>
    <div class="card kpi"><div class="label">Reservas</div><div class="val">${ocupSlots}</div><div class="mini">${fijosSemana} turnos fijos · ${totalSlots} disponibles</div></div>`;
}

window.clickSlot = async (cancha, fecha, hora, id) => {
  if (id) { verTurno(id); return; }
  reservarTurno(cancha, fecha, hora);
};

function reservarTurno(cancha, fecha, hora) {
  formModal({
    title: `Reservar turno — ${cancha}`,
    fields: [
      { name: 'fecha_info', label: 'Fecha y hora', type: 'text', full: true, default: `${fmtF(fecha)} · ${hora}:00 a ${hora+1}:00 hs` },
      { name: 'cliente', label: 'Cliente', required: true, full: true, placeholder: 'Nombre del que reserva' },
      { name: 'telefono', label: 'Teléfono', placeholder: '11-XXXX-XXXX' },
      { name: 'monto', label: 'Monto', type: 'number', step: '100', default: cancha === 'Cesar La Paglia' ? 150000 : 90000 },
      { name: 'pagado', label: 'Ya pagó el turno', type: 'checkbox', full: true },
    ],
    submitLabel: 'Reservar',
    onSubmit: async (v) => {
      // el campo fecha_info es solo lectura
      delete v.fecha_info;
      v.cancha = cancha; v.fecha = fecha; v.hora = hora;
      v.monto = Number(v.monto) || 0;
      const r = await api('/alquileres', { method: 'POST', body: v });
      if (!r || r.error) { toast('Error: ' + ((r && r.error) || 'no se pudo guardar, probá de nuevo'), 'err'); return true; }
      toast('Turno reservado');
      renderAlquilerGrid();
      return false;
    }
  });
}

async function verTurno(id) {
  // Necesitamos buscar el turno — consultamos todos los de la semana y filtramos
  const res = await api('/alquileres');
  const turno = (res || []).find(t => t.id === id);
  if (!turno) { toast('Reserva no encontrada', 'err'); renderAlquilerGrid(); return; }

  const html = `<dl class="info-grid">
    <dt>Cancha</dt><dd>${esc(turno.cancha)}</dd>
    <dt>Fecha</dt><dd>${fmtF(turno.fecha)}</dd>
    <dt>Hora</dt><dd>${turno.hora}:00 a ${Number(turno.hora)+1}:00 hs</dd>
    <dt>Cliente</dt><dd>${esc(turno.cliente || '—')}</dd>
    <dt>Teléfono</dt><dd>${esc(turno.telefono || '—')}</dd>
    <dt>Monto</dt><dd>${fmtM(turno.monto)}</dd>
    <dt>Estado</dt><dd><span class="badge ${turno.pagado ? 'b-ok' : 'b-err'}">${turno.pagado ? 'Pagado' : 'Pendiente de pago'}</span></dd>
  </dl>`;

  modal({
    title: `Reserva ${esc(turno.cancha)}`,
    html,
    actions: [
      { label: 'Cerrar', variant: 'ghost' },
      {
        label: turno.pagado ? 'Marcar como impago' : 'Marcar como pagado',
        onClick: async () => {
          const r = await api('/alquileres/' + id, { method: 'PUT', body: { pagado: !turno.pagado } });
          if (!r || r.error) { toast('Error: ' + ((r && r.error) || 'no se pudo guardar, probá de nuevo'), 'err'); return true; }
          toast(!turno.pagado ? 'Marcado como pagado' : 'Marcado como impago');
          renderAlquilerGrid();
          return false;
        }
      },
      {
        label: 'Cancelar reserva',
        variant: 'alt',
        onClick: async () => {
          if (!confirm('¿Cancelar esta reserva? No se puede deshacer.')) return true;
          await api('/alquileres/' + id, { method: 'DELETE' });
          toast('Reserva cancelada');
          renderAlquilerGrid();
          return false;
        }
      },
    ]
  });
}

async function simularAcceso() {
  const input = document.getElementById('inCarnet').value.trim();
  const t = document.getElementById('terminal');
  if (!input) return;

  let rfid = input;
  const m = input.match(/^CP-0*(\d+)$/i);
  if (m) {
    const s = await api('/socios/' + m[1]);
    if (!s) {
      t.innerHTML = `<div>[ MOLINETE PRINCIPAL · Puerta 1 ]</div><div class="no">✘ Carnet no encontrado: ${esc(input)}</div>`;
      return;
    }
    rfid = s.rfid;
  }

  const stamp = new Date().toLocaleTimeString('es-AR');
  const res = await api('/acceso/validar', { method: 'POST', body: { rfid, puerta: 'Molinete Principal' } });
  if (!res) {
    t.innerHTML = `<div>[ MOLINETE PRINCIPAL · Puerta 1 ]</div><div class="no">✘ Error de conexión con el servidor</div>`;
    return;
  }

async function enviarChat() {
  const inp = document.getElementById('chatIn');
  const msgs = document.getElementById('chatMsgs');
  const btn = document.getElementById('chatSendBtn');
  const pregunta = inp.value.trim();
  if (!pregunta) return;
  msgs.insertAdjacentHTML('beforeend', `<div class="bubble u">${esc(pregunta)}</div>`);
  inp.value = '';
  inp.disabled = true; btn.disabled = true;
  const loading = document.createElement('div');
  loading.className = 'bubble b'; loading.textContent = 'Pensando…'; loading.style.fontStyle = 'italic'; loading.style.opacity = '.7';
  msgs.appendChild(loading);
  msgs.scrollTop = msgs.scrollHeight;

  const r = await api('/asistente', { method: 'POST', body: { pregunta, historial: state.historial } });
  loading.remove();
  if (r && r.respuesta) {
    state.historial = r.nuevo_historial || state.historial;
    msgs.insertAdjacentHTML('beforeend', `<div class="bubble b">${renderMD(r.respuesta)}</div>`);
  } else {
    msgs.insertAdjacentHTML('beforeend', `<div class="bubble b" role="alert" style="color:var(--rojo-osc)">Error: ${esc(r?.error || 'sin respuesta')}</div>`);
  }
  msgs.scrollTop = msgs.scrollHeight;
  inp.disabled = false; btn.disabled = false;
  inp.focus();
}

window.exportarSocios = async () => {
  const data = await api('/socios');
  if (!data) return;
  const rows = [['ID','Carnet','Nombre','DNI','RFID','Genero','Estado','Saldo','Telefono','Email','Disciplinas','Nacimiento','Alta']];
  (data.socios || []).forEach(s => {
    const est = displayEstado(s);
    rows.push([
      s.id, carnet(s.id), s.nombre, s.dni, s.rfid, s.genero || '', est.label, s.saldo, s.telefono || '', s.email || '',
      Array.isArray(s.disciplinas) ? s.disciplinas.join(' | ') : '',
      s.fecha_nacimiento || '', s.fecha_alta || '',
    ]);
  });
  const csv = rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `socios-${isoDate(new Date())}.csv`; a.click();
  URL.revokeObjectURL(url);
};

    const mes = new Date().getMonth();
    return socios.filter(s => s.fecha_nacimiento && new Date(s.fecha_nacimiento).getMonth() === mes);
  }
  return socios;
}

window.editarUsuario = (id) => {
  const u = (window._usuarios || []).find(x => x.id === id);
  if (!u) { toast('Usuario no encontrado', 'err'); return; }
  formModal({
    title: `Editar usuario · ${u.nombre}`,
    initial: { nombre: u.nombre, rol: u.rol, activo: u.activo ? '1' : '' },
    fields: [
      { name: 'nombre', label: 'Nombre completo', required: true, full: true },
      { name: 'rol', label: 'Rol', type: 'select', required: true, options: OPCIONES_ROL },
      { name: 'activo', label: 'Activo (puede ingresar al panel)', type: 'checkbox' },
      { name: 'password', label: 'Nueva contraseña (vacío = no cambiar)', type: 'password' },
    ],
    submitLabel: 'Guardar cambios',
    onSubmit: async (v) => {
      const body = { nombre: v.nombre, rol: v.rol, activo: !!v.activo };
      if (v.password) body.password = v.password;
      const r = await api('/usuarios/' + id, { method: 'PUT', body });
      if (!r || r.error) { toast('Error: ' + ((r && r.error) || 'no se pudo guardar, probá de nuevo'), 'err'); return true; }
      toast('Usuario actualizado');
      render('usuarios');

  });
};

window.emitirCuotas = async () => {
  const [discs, cfg] = await Promise.all([ api('/disciplinas'), api('/config') ]);
  const social = Number(cfg?.cuota_social ?? 1000);
  const periodoDefault = new Date().toISOString().slice(0, 7);
  const html = `
    <p class="mini">Se emite una cuota a cada socio activo, calculada según las disciplinas que hace:</p>
    <div class="card" style="background:var(--verde-claro);margin:10px 0">
      <div class="row" style="justify-content:space-between"><span>Cuota social (todos)</span><b>$${social.toLocaleString('es-AR')}</b></div>
      ${(discs || []).map(d => `<div class="row" style="justify-content:space-between"><span>${esc(d.nombre)}</span><b>$${Number(d.precio ?? 48000).toLocaleString('es-AR')}</b></div>`).join('')}
      <p class="mini" style="margin:8px 0 0">Estos valores se editan en Configuración.</p>
    </div>
    <div class="form-grid">
      <label>Período (YYYY-MM)<input id="emiPeriodo" value="${periodoDefault}"></label>
      <label>Fecha de vencimiento<input id="emiVenc" type="date"></label>
    </div>`;
  modal({
    title: 'Emitir cuotas del período',
    html,
    actions: [
      { label: 'Cancelar', variant: 'ghost' },
      { label: 'Emitir', onClick: async () => {
        const periodo = (document.getElementById('emiPeriodo').value || '').trim();
        const fecha_venc = document.getElementById('emiVenc').value || undefined;
        if (!periodo) { toast('Ingresá el período (YYYY-MM)', 'err'); return true; }
        const r = await api('/cuotas/emitir', { method: 'POST', body: { periodo, fecha_venc } });
        if (!r || r.error) { toast('Error: ' + ((r && r.error) || 'no se pudo emitir'), 'err'); return true; }
        toast(r.mensaje || 'Cuotas emitidas');
        render('cuotas');
      }},
    ]
  });
};

function afterRender(p) {
  if (p === 'socios') {
    renderSocios();
    ['buscaSocio','filtroEstado','filtroGenero'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', debounce(renderSocios, 250));
    });
  }
  if (p === 'alquileres') {
    renderAlquilerGrid();
  }
  if (p === 'fijos') {
    cargarFijos();
  }
}
function debounce(fn, ms) {
  let t; return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); };
}
